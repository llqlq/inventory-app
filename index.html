<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f6">
    <title>物品库存</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">个人物品管理</p>
          <h1>物品库存</h1>
        </div>
        <button class="icon-button secondary" id="backupBtn" aria-label="备份" title="备份">⇩</button>
      </header>

      <main>
        <section class="summary-grid" aria-label="库存概览">
          <article class="summary-tile">
            <span id="totalCount">0</span>
            <p>总物品</p>
          </article>
          <article class="summary-tile alert">
            <span id="expiringCount">0</span>
            <p>临期</p>
          </article>
          <article class="summary-tile warning">
            <span id="lowCount">0</span>
            <p>低库存</p>
          </article>
        </section>

        <section class="toolbar" aria-label="查找和筛选">
          <label class="search-field">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="搜索名称、位置、备注">
          </label>
          <div class="filter-row" role="group" aria-label="状态筛选">
            <button class="chip active" data-filter="all">全部</button>
            <button class="chip" data-filter="expiring">临期</button>
            <button class="chip" data-filter="low">低库存</button>
            <button class="chip" data-filter="expired">已过期</button>
          </div>
        </section>

        <section class="list-head">
          <h2>清单</h2>
          <button class="icon-button primary compact" id="addBtn" aria-label="新增物品" title="新增物品">+</button>
        </section>

        <section class="inventory-table-wrap" aria-live="polite">
          <table class="inventory-table">
            <thead>
              <tr>
                <th>分类</th>
                <th>名称</th>
                <th>库存</th>
                <th>位置</th>
              </tr>
            </thead>
            <tbody id="itemsList"></tbody>
          </table>
        </section>

        <section id="emptyState" class="empty-state" hidden>
          <h2>还没有记录</h2>
          <p>先添加常用药品、食品、清洁用品、数码配件或任何你容易忘记数量和位置的东西。</p>
          <button class="solid-button" id="emptyAddBtn">新增第一件物品</button>
        </section>
      </main>
    </div>

    <dialog id="itemDialog">
      <form id="itemForm" method="dialog">
        <div class="dialog-head">
          <h2 id="dialogTitle">新增物品</h2>
          <button class="icon-button" type="button" id="closeDialogBtn" aria-label="关闭" title="关闭">×</button>
        </div>

        <input type="hidden" id="itemId">
        <label>
          名称
          <input id="nameInput" required placeholder="例如：感冒药、米、充电线">
        </label>
        <div class="form-grid">
          <label>
            数量
            <input id="quantityInput" type="number" min="0" step="1" required value="1">
          </label>
          <label>
            单位
            <input id="unitInput" placeholder="件 / 盒 / 袋">
          </label>
        </div>
        <div class="form-grid">
          <label>
            低库存线
            <input id="minInput" type="number" min="0" step="1" value="1">
          </label>
          <label>
            有效期
            <input id="expiryInput" type="date">
          </label>
        </div>
        <label>
          存放位置
          <input id="locationInput" placeholder="例如：厨房二层、卧室抽屉">
        </label>
        <label>
          分类
          <select id="categoryInput">
            <option>食品</option>
            <option>药品</option>
            <option>日用品</option>
            <option>清洁用品</option>
            <option>数码配件</option>
            <option>文件证件</option>
            <option>其他</option>
          </select>
        </label>
        <label>
          照片
          <input id="photoInput" type="file" accept="image/*" capture="environment">
        </label>
        <div class="photo-preview" id="photoPreview" hidden>
          <img id="photoPreviewImg" alt="物品照片预览">
          <button class="ghost-button" type="button" id="removePhotoBtn">移除照片</button>
        </div>
        <label>
          备注
          <textarea id="notesInput" rows="3" placeholder="规格、购买渠道、开封日期等"></textarea>
        </label>

        <div class="dialog-actions">
          <button class="ghost-button" type="button" id="deleteBtn">删除</button>
          <button class="solid-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <dialog id="backupDialog">
      <div class="dialog-head">
        <h2>备份与恢复</h2>
        <button class="icon-button" type="button" id="closeBackupBtn" aria-label="关闭" title="关闭">×</button>
      </div>
      <p class="help-text">导出 JSON 可以换手机或清浏览器前备份；恢复会合并导入的记录。</p>
      <div class="backup-actions">
        <button class="solid-button" id="exportBtn">导出备份</button>
        <label class="file-button">
          导入备份
          <input id="importInput" type="file" accept="application/json">
        </label>
      </div>
    </dialog>

    <template id="itemTemplate">
      <tr class="item-row">
        <td class="category-cell"></td>
        <td>
          <button class="item-name" type="button">
            <img class="item-photo" alt="">
            <span class="name-text"></span>
            <span class="status-pill"></span>
          </button>
        </td>
        <td>
          <div class="quantity-inline" aria-label="调整数量">
            <button class="qty-btn decrease" aria-label="减少数量">−</button>
            <span class="quantity-value"></span>
            <button class="qty-btn increase" aria-label="增加数量">+</button>
          </div>
        </td>
        <td class="location-cell"></td>
      </tr>
    </template>

    <script src="app.js"></script>
  </body>
</html>
